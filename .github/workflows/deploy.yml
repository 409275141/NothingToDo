name: Deploy to Server

on:
  workflow_dispatch:  # 手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore SimpleBookkeeping/Api/SimpleBookkeeping.Api.csproj

    - name: Build
      run: dotnet build SimpleBookkeeping/Api/SimpleBookkeeping.Api.csproj --configuration Release --no-restore

    - name: Publish
      run: dotnet publish SimpleBookkeeping/Api/SimpleBookkeeping.Api.csproj --configuration Release --no-build --output ./publish

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to Server
      run: |
        # 1. 停止服务，释放文件锁
        ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
          'sudo systemctl stop simplebookkeeping 2>/dev/null || true'

        # 2. 确保目标目录存在，拷贝新文件
        ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
          'sudo mkdir -p /var/www/simplebookkeeping && sudo chown -R $USER:$USER /var/www/simplebookkeeping'
        scp -r ./publish/* ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/simplebookkeeping/

        # 3. 更新服务配置并重启
        # 注意：EOF 和 SERVICE 终结符必须在剥离 YAML 缩进后位于行首（0 列）
        # YAML run: | 会剥除 8 个空格的基准缩进，因此下方所有行与 EOF 保持相同的 8 空格缩进
        ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 'bash -s' << 'EOF'
        sudo tee /etc/systemd/system/simplebookkeeping.service > /dev/null << 'SERVICE'
        [Unit]
        Description=SimpleBookkeeping API
        After=network.target

        [Service]
        WorkingDirectory=/var/www/simplebookkeeping
        ExecStart=/usr/bin/dotnet /var/www/simplebookkeeping/SimpleBookkeeping.Api.dll
        Restart=always
        RestartSec=10
        SyslogIdentifier=simplebookkeeping
        Environment=ASPNETCORE_ENVIRONMENT=Production
        Environment=ASPNETCORE_URLS=http://0.0.0.0:8080
        StandardOutput=append:/var/www/simplebookkeeping/app.log
        StandardError=append:/var/www/simplebookkeeping/app.log

        [Install]
        WantedBy=multi-user.target
        SERVICE
        sudo systemctl daemon-reload
        sudo systemctl enable simplebookkeeping
        sudo systemctl restart simplebookkeeping
        EOF
